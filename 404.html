<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — PG Manager</title>
<meta name="description" content="The page you're looking for doesn't exist. Go back to the PG Manager dashboard." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563EB'/%3E%3Cg fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 18v-8'/%3E%3Cpath d='M4 14h16v4'/%3E%3Cpath d='M20 14v-1.5a2 2 0 0 0-2-2h-7V14'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<style>
  .nf{
    max-width:520px;margin:0 auto;padding:96px 24px;text-align:center;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  }
  .nf-code{
    font-size:80px;font-weight:800;letter-spacing:-.06em;line-height:1;
    background:var(--brand-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:16px;
  }
  .nf h1{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:0 0 12px;color:var(--text)}
  .nf p{color:var(--muted);margin:0 0 32px;font-size:15px;line-height:1.6;max-width:36ch}
  .nf-link{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--brand-grad);color:#fff;text-decoration:none;
    font-weight:620;font-size:15px;padding:14px 28px;border-radius:12px;
    min-height:48px;box-shadow:0 2px 10px -2px var(--ring),inset 0 1px 0 rgba(255,255,255,.2);
    transition:transform .15s ease,box-shadow .2s ease;
  }
  .nf-link:hover{transform:translateY(-1px);box-shadow:0 8px 20px -5px var(--ring)}
  .nf-link:active{transform:translateY(1px)}
  .nf-icon{font-size:18px}
  .nf-sub{margin-top:20px;font-size:13px;color:var(--faint)}
  .nf-sub a{color:var(--brand);text-decoration:none;font-weight:500}
  .nf-sub a:hover{text-decoration:underline}
  @media(max-width:640px){
    .nf{padding:64px 20px}
    .nf-code{font-size:64px}
    .nf h1{font-size:24px}
    .nf-link{width:100%;justify-content:center}
  }
</style>
</head>
<body>
  <div class="nf">
    <div class="nf-code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="nf-link">
      <span class="nf-icon">←</span>
      Back to Dashboard
    </a>
    <div class="nf-sub">
      Or <a href="/login.html">sign in</a> to access your account
    </div>
  </div>
</body>
</html>
